<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>海大海廢社群地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">NTOU Marine Debris Map</p>
        <h1>海大海廢社群地圖</h1>
      </div>
      <div class="topbar-actions">
        <button id="profileBtn" type="button">個人主頁</button>
        <button id="homeBtn" type="button">回到海大</button>
      </div>
    </header>

    <main class="layout">
      <section class="map-section" aria-label="海洋廢棄物互動地圖">
        <div class="filter-bar" aria-label="分類篩選">
          <button class="filter active" data-filter="all" type="button">全部</button>
          <button class="filter activity" data-filter="activity" type="button">活動</button>
          <button class="filter trash" data-filter="trash" type="button">垃圾</button>
          <button class="filter beach-clean" data-filter="beach-clean" type="button">淨灘</button>
          <label class="status-toggle">
            <input id="showCleanedToggle" type="checkbox">
            顯示已清理區
          </label>
          <label class="status-toggle">
            <input id="showExpiredToggle" type="checkbox">
            顯示歷史活動
          </label>
          <label class="date-filter">
            起
            <input id="rangeStartInput" type="date">
          </label>
          <label class="date-filter">
            迄
            <input id="rangeEndInput" type="date">
          </label>
        </div>
        <div class="map-wrap">
          <div id="map"></div>
          <div class="map-actions" aria-label="地圖操作">
            <button id="addMarkerBtn" class="map-action primary" type="button">新增標記</button>
            <button id="myLocationBtn" class="map-action" type="button">我的位置</button>
          </div>
        </div>
      </section>

      <aside class="sidebar" aria-label="新增回報與淨灘活動">
        <section id="locationChoicePanel" class="panel hidden">
          <div class="panel-title">
            <h2>選擇標記位置</h2>
            <button id="closeChoiceBtn" type="button" aria-label="關閉位置選擇">×</button>
          </div>
          <p class="hint">可以使用裝置 GPS，也可以在地圖上手動點選位置。</p>
          <div class="choice-actions">
            <button id="useGpsBtn" class="primary" type="button">使用當前 GPS 位置</button>
            <button id="manualPickBtn" type="button">地圖手動點擊</button>
          </div>
        </section>

        <section id="formPanel" class="panel hidden">
          <div class="panel-title">
            <h2 id="formTitle">新增回報</h2>
            <button id="closeFormBtn" type="button" aria-label="關閉表單">×</button>
          </div>
          <p id="pickedLocation" class="hint">請先點擊地圖選擇位置。</p>
          <form id="markerForm" novalidate>
            <label>
              分類
              <select name="category" id="category" required>
                <option value="trash">垃圾</option>
                <option value="activity">活動</option>
                <option value="beach-clean">淨灘</option>
              </select>
            </label>

            <label id="trashLevelField">
              垃圾程度
              <select name="trashLevel">
                <option value="light">輕微</option>
                <option value="medium">中等</option>
                <option value="heavy">嚴重</option>
              </select>
            </label>

            <div id="trashAdvancedFields" class="trash-advanced">
              <label>
                預估數量 / 袋數
                <input name="quantity" id="quantityInput" type="number" min="0" step="1" placeholder="例如：3">
              </label>
              <label>
                預估重量（公斤）
                <input name="weightKg" id="weightKgInput" type="number" min="0" step="0.1" placeholder="例如：12.5">
              </label>
              <input name="carbonSaved" id="carbonSavedInput" type="hidden" value="0">
              <div id="carbonPreview" class="carbon-preview hidden">預估碳減量：0 kg CO2e</div>
              <fieldset class="trash-type-fieldset">
                <legend>垃圾類別與特殊狀況</legend>
                <label><input name="trashTypes" type="checkbox" value="一般塑膠"> 一般塑膠</label>
                <label><input name="trashTypes" type="checkbox" value="保麗龍"> 保麗龍</label>
                <label><input name="trashTypes" type="checkbox" value="玻璃金屬"> 玻璃 / 金屬</label>
                <label><input name="trashTypes" type="checkbox" value="漁網繩索"> 漁網 / 繩索</label>
                <label><input name="trashTypes" type="checkbox" value="易燃毒化物質"> 易燃毒化物質</label>
                <label><input name="trashTypes" type="checkbox" value="醫療廢棄物"> 醫療廢棄物</label>
                <label><input name="trashTypes" type="checkbox" value="爆裂物軍火"> 爆裂物 / 軍火</label>
                <label><input name="trashTypes" type="checkbox" value="動物屍體"> 動物屍體</label>
                <label><input name="trashTypes" type="checkbox" value="海龜鯨豚"> 海龜 / 鯨豚</label>
                <label><input name="trashTypes" type="checkbox" value="疑似豬屍"> 疑似非洲豬瘟豬屍</label>
                <label><input name="trashTypes" type="checkbox" value="大量魚群死亡或水質污染"> 大量魚群死亡或水質污染</label>
              </fieldset>
              <div id="riskPreview" class="hidden"></div>
            </div>

            <label>
              顯示暱稱
              <input name="displayName" id="displayNameInput" maxlength="80" placeholder="例如：海大志工">
            </label>

            <label>
              標題
              <input name="title" maxlength="120" required placeholder="例如：八斗子岸邊漂流物">
            </label>

            <label>
              文字敘述
              <textarea name="description" maxlength="2000" rows="4" placeholder="補充地點、數量或集合方式"></textarea>
            </label>

            <div id="timeFields" class="time-grid hidden">
              <label>
                發起人員 / 主辦單位
                <input name="organizer" maxlength="120" placeholder="例如：海洋志工社">
              </label>
              <label>
                發起人員信箱
                <input name="organizerEmail" type="email" maxlength="160" placeholder="contact@example.com">
              </label>
              <label>
                活動地點
                <input name="locationName" maxlength="160" placeholder="例如：八斗子潮境公園入口">
              </label>
              <label>
                活動 / 報名網址
                <input name="eventUrl" type="url" maxlength="500" placeholder="https://...">
              </label>
              <label>
                開始時間
                <input name="startAt" type="datetime-local">
              </label>
              <label>
                結束時間
                <input name="endAt" type="datetime-local">
              </label>
              <label id="maxParticipantsField">
                報名人數上限
                <input name="maxParticipants" type="number" min="0" step="1" placeholder="0 表示不限人數">
              </label>
            </div>

            <label>
              圖片
              <input name="images" type="file" accept="image/*" multiple>
            </label>

            <p id="formError" class="error" role="alert"></p>
            <button class="primary" type="submit">送出回報</button>
          </form>
        </section>

        <section id="profilePanel" class="panel hidden">
          <div class="panel-title">
            <h2>個人主頁</h2>
            <button id="closeProfileBtn" type="button" aria-label="關閉個人主頁">×</button>
          </div>
          <form id="profileForm" novalidate>
            <label>
              顯示暱稱
              <input name="displayName" maxlength="80" placeholder="例如：海大志工">
            </label>
            <label>
              個人敘述 / 聯繫方式
              <textarea name="bio" maxlength="500" rows="3" placeholder="可填聯繫方式、社群帳號或想公開的說明"></textarea>
            </label>
            <button class="primary" type="submit">儲存個人資料</button>
          </form>
          <div class="profile-posts">
            <h3>我的貼文</h3>
            <div id="myMarkersList" class="events-list"></div>
          </div>
        </section>

        <section class="panel">
          <h2>即將到來的淨灘活動</h2>
          <div id="eventsList" class="events-list"></div>
        </section>
      </aside>
    </main>

    <section id="detailPanel" class="detail-panel hidden" aria-label="完整內容">
      <div class="detail-card">
        <div class="panel-title">
          <h2 id="detailTitle">完整內容</h2>
          <button id="closeDetailBtn" type="button" aria-label="關閉完整內容">×</button>
        </div>
        <div id="detailBody" class="detail-body"></div>
      </div>
    </section>

    <section id="userPanel" class="detail-panel hidden" aria-label="使用者資料">
      <div class="detail-card user-card">
        <div class="panel-title">
          <h2 id="userPanelTitle">使用者資料</h2>
          <button id="closeUserPanelBtn" type="button" aria-label="關閉使用者資料">×</button>
        </div>
        <div id="userPanelBody" class="detail-body"></div>
      </div>
    </section>

    <div id="toast" class="toast hidden" role="status"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
  </body>
</html>
